server:
  port: 8080
spring:
  application:
    name: "security_course"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: false # Disable H2 console for production-like setup
      path: "/h2"
  profiles:
    include: null
  thymeleaf:
    prefix: "classpath:/templates/"
    suffix: ".html"
    cache: false
