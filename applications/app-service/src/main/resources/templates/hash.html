<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Generador de Hash</title>
</head>
<body>
<h1>Hash Generator</h1>

<form th:action="@{/hash}" method="post">
    <label for="palabra">Palabra:</label>
    <input type="text" id="palabra" name="palabra" required>
    <br><br>

    <label for="algoritmo">Algoritmo:</label>
    <select id="algoritmo" name="algoritmo">
        <option value="sha256">SHA-256</option>
        <option value="md5">MD5</option>
        <option value="argon2id">Argon2id</option>
    </select>
    <br><br>

    <button type="submit">Hashear</button>
</form>

<div th:if="${hash}">
    <h2>Resultado:</h2>
    <p><strong th:text="${algoritmo}"></strong>: <span th:text="${hash}"></span></p>
</div>

</body>
</html>
