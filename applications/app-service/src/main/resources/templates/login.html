<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        div.container {
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #333;
        }

        form div {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #444;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #0077cc;
            outline: none;
        }

        button {
            width: 100%;
            background-color: #0077cc;
            color: white;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #005fa3;
        }

        .g-recaptcha {
            margin-bottom: 1rem;
            display: flex;
            justify-content: center;
        }

        p {
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Iniciar sesión</h2>
    <form th:action="@{/login}" method="post">
        <div>
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
        </div>

        <div class="g-recaptcha" data-sitekey="6Lev9xorAAAAANlwTx7qBRAe7I_snS9x3qqoXket"></div>
        <div>
            <button type="submit">Ingresar</button>
        </div>

        <div th:if="${param.error}">
            <p style="color: red;" th:if="${session['SPRING_SECURITY_LAST_EXCEPTION'] != null and session['SPRING_SECURITY_LAST_EXCEPTION'].message == 'La cuenta está temporalmente bloqueada.'}">
                Tu cuenta ha sido temporalmente bloqueada por múltiples intentos fallidos. Inténtalo de nuevo en unos minutos.
            </p>
            <p style="color: red;" th:if="${session['SPRING_SECURITY_LAST_EXCEPTION'] == null or session['SPRING_SECURITY_LAST_EXCEPTION'].message != 'La cuenta está temporalmente bloqueada.'}">
                Usuario o contraseña inválidos.
            </p>
        </div>
        <div th:if="${captchaError}">
            <p style="color: red;">Captcha inválido.</p>
        </div>
        <div th:if="${param.logout}">
            <p style="color: green;">Sesión cerrada exitosamente.</p>
        </div>
    </form>
</div>
</body>
</html>
