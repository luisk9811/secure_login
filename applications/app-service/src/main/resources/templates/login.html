<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
<div>
    <h2>Iniciar sesión</h2>
    <form th:action="@{/login}" method="post">
        <div>
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
        </div>

        <div class="g-recaptcha" data-sitekey="6Lev9xorAAAAANlwTx7qBRAe7I_snS9x3qqoXket"></div> <div>
        <button type="submit">Ingresar</button>
    </div>

        <div th:if="${param.error}">
            <p style="color: red;" th:if="${session['SPRING_SECURITY_LAST_EXCEPTION'] != null and session['SPRING_SECURITY_LAST_EXCEPTION'].message == 'La cuenta está temporalmente bloqueada.'}">
                Tu cuenta ha sido temporalmente bloqueada por múltiples intentos fallidos. Inténtalo de nuevo en unos minutos.
            </p>
            <p style="color: red;" th:if="${session['SPRING_SECURITY_LAST_EXCEPTION'] == null or session['SPRING_SECURITY_LAST_EXCEPTION'].message != 'La cuenta está temporalmente bloqueada.'}">
                Usuario o contraseña inválidos.
            </p>
        </div>
        <div th:if="${captchaError}">
            <p style="color: red;">Captcha inválido.</p>
        </div>
        <div th:if="${param.logout}">
            <p style="color: green;">Sesión cerrada exitosamente.</p>
        </div>
    </form>
</div>
</body>
</html>
